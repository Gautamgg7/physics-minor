<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300"><rect width="520" height="300" fill="#fff"/><line x1="40" y1="150" x2="480" y2="150" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#de)"/><text x="470" y="140" font-size="14">E</text><line x1="200" y1="190" x2="320" y2="110" stroke="#4f46e5" stroke-width="4"/><circle cx="200" cy="190" r="10" fill="#312e81"/><text x="182" y="218" font-size="14">−q</text><circle cx="320" cy="110" r="10" fill="#e11d48"/><text x="322" y="92" font-size="14">+q</text><line x1="212" y1="181" x2="308" y2="119" stroke="#111" stroke-width="2" marker-end="url(#dt)"/><text x="252" y="140" font-size="14">p = q·d</text><line x1="320" y1="110" x2="380" y2="110" stroke="#e11d48" stroke-width="2" marker-end="url(#df)"/><text x="385" y="114" font-size="14">F = qE</text><line x1="200" y1="190" x2="140" y2="190" stroke="#e11d48" stroke-width="2" marker-end="url(#df)"/><text x="92" y="194" font-size="14">F = −qE</text><path d="M300,150 A40,40 0 0,0 293,128" fill="none" stroke="#111" stroke-width="1.5"/><text x="302" y="140" font-size="14">θ</text><defs><marker id="de" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#111" stroke-width="1.5"/></marker><marker id="dt" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#111" stroke-width="1.5"/></marker><marker id="df" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#e11d48" stroke-width="1.5"/></marker></defs><text x="260" y="260" text-anchor="middle" font-size="14">Dipole torque: τ = p × E, |τ| = pE·sinθ</text></svg>
