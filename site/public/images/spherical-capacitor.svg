<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300"><rect width="520" height="300" fill="#fff"/><circle cx="260" cy="140" r="100" fill="none" stroke="#312e81" stroke-width="3"/><circle cx="260" cy="140" r="55" fill="none" stroke="#e11d48" stroke-width="3"/><circle cx="260" cy="140" r="5" fill="#111"/><text x="260" y="80" text-anchor="middle" font-size="14">inner radius a (+Q)</text><text x="260" y="262" text-anchor="middle" font-size="14">outer radius b, earthed (−Q)</text><line x1="315" y1="140" x2="352" y2="140" stroke="#0d9488" stroke-width="2" marker-end="url(#c)"/><text x="300" y="130" text-anchor="middle" font-size="13" fill="#0d9488">E = Q/4πε₀r²</text><text x="356" y="148" font-size="16">⏚</text><defs><marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#0d9488" stroke-width="1.5"/></marker></defs><text x="260" y="290" text-anchor="middle" font-size="13">Spherical capacitor: C = 4πε₀ab/(b − a)</text></svg>
