<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260"><rect width="520" height="260" fill="#fff"/><rect x="40" y="60" width="440" height="14" fill="#eee" stroke="#111"/><rect x="40" y="74" width="440" height="26" fill="#cde" stroke="#4f46e5" stroke-width="2"/><rect x="40" y="100" width="440" height="14" fill="#eee" stroke="#111"/><text x="20" y="70" font-size="12">glass</text><text x="20" y="92" font-size="12">air film t</text><text x="20" y="112" font-size="12">glass</text><line x1="200" y1="20" x2="200" y2="74" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a1)"/><line x1="200" y1="74" x2="140" y2="30" stroke="#e11d48" stroke-width="2"/><text x="120" y="25" font-size="12">no flip (denser→rarer)</text><line x1="320" y1="20" x2="320" y2="100" stroke="#4f46e5" stroke-width="2.5"/><line x1="320" y1="100" x2="380" y2="30" stroke="#e11d48" stroke-width="2"/><text x="360" y="25" font-size="12">λ/2 flip (rarer→denser) ★</text><defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#4f46e5" stroke-width="1.5"/></marker></defs><text x="260" y="150" text-anchor="middle" font-size="13">Thin film: one Stokes reversal → Δ = 2t + λ/2</text><text x="260" y="170" text-anchor="middle" font-size="13">bright: 2t = (n − ½)λ · dark: 2t = nλ · centre (t=0) dark</text><text x="260" y="200" font-size="13">t = r²/2R gives rings (see newton.svg)</text><text x="260" y="225" font-size="12" fill="#555">★ reflection at denser medium adds π phase = λ/2 path</text></svg>
