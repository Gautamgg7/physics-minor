<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260"><rect width="520" height="260" fill="#fff"/><line x1="30" y1="150" x2="490" y2="150" stroke="#111" stroke-width="2"/><text x="60" y="70" font-size="14">medium 1 (v₁)</text><text x="60" y="200" font-size="14">medium 2 (v₂)</text><line x1="200" y1="30" x2="200" y2="230" stroke="#999" stroke-width="1" stroke-dasharray="5 4"/><line x1="120" y1="40" x2="260" y2="185" stroke="#e11d48" stroke-width="2.5"/><line x1="140" y1="60" x2="230" y2="60" stroke="#4f46e5" stroke-width="3"/><line x1="245" y1="170" x2="335" y2="170" stroke="#0d9488" stroke-width="3"/><text x="215" y="55" font-size="14">i</text><text x="290" y="140" font-size="14">r</text><text x="150" y="90" fill="#4f46e5" font-size="13">incident front (v₁t)</text><text x="300" y="195" fill="#0d9488" font-size="13">refracted front (v₂t)</text><text x="260" y="245" text-anchor="middle" font-size="14">Huygens refraction: sin i / sin r = v₁/v₂ = n₂/n₁</text></svg>
