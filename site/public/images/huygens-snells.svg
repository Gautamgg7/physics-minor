<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300"><rect width="520" height="300" fill="#fff"/><text x="60" y="40" font-size="13">medium 1 (speed v1)</text><text x="60" y="280" font-size="13">medium 2 (speed v2 &lt; v1)</text><line x1="40" y1="160" x2="480" y2="160" stroke="#111" stroke-width="2.5"/><text x="430" y="150" font-size="13">interface</text><line x1="200" y1="60" x2="200" y2="262" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="206" y="74" font-size="13" fill="#64748b">normal</text><line x1="200" y1="160" x2="112" y2="62" stroke="#4f46e5" stroke-width="3"/><polygon points="112,62 124,74 114,82" fill="#4f46e5"/><text x="118" y="108" font-size="14" fill="#4f46e5">incident ray</text><line x1="200" y1="160" x2="260" y2="258" stroke="#0d9488" stroke-width="3"/><polygon points="260,258 248,248 242,258" fill="#0d9488"/><text x="268" y="238" font-size="14" fill="#0d9488">refracted ray</text><path d="M158,108 A62,62 0 0 1 200,98" fill="none" stroke="#4f46e5" stroke-width="1.5"/><text x="166" y="90" font-size="14" fill="#4f46e5">i</text><path d="M200,206 A54,54 0 0 0 230,232" fill="none" stroke="#0d9488" stroke-width="1.5"/><text x="220" y="230" font-size="14" fill="#0d9488">r</text><line x1="112" y1="62" x2="152" y2="110" stroke="#4f46e5" stroke-width="1.5"/><text x="96" y="96" font-size="12" fill="#4f46e5">incident wavefront ⊥ ray</text><circle cx="200" cy="160" r="44" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5 3"/><text x="212" y="188" font-size="12" fill="#0d9488">secondary wavelet (span v2·t)</text><text x="260" y="292" text-anchor="middle" font-size="14">Shared intercept gives sin i / sin r = v1 / v2 (Snell's law)</text></svg>
