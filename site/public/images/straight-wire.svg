<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300"><rect width="520" height="300" fill="#fff"/><line x1="260" y1="30" x2="260" y2="250" stroke="#4f46e5" stroke-width="5"/><polygon points="252,70 268,70 260,54" fill="#4f46e5"/><text x="260" y="275" text-anchor="middle" font-size="13">straight wire, current I upward</text><g font-size="18" fill="#0d9488" text-anchor="middle"><text x="330" y="110">⊗</text><text x="330" y="160">⊗</text><text x="330" y="210">⊗</text><text x="190" y="110">⊙</text><text x="190" y="160">⊙</text><text x="190" y="210">⊙</text><text x="400" y="110">⊗</text><text x="400" y="160">⊗</text><text x="120" y="160">⊙</text><text x="120" y="210">⊙</text></g><text x="400" y="210" font-size="13" fill="#0d9488">B into page (⊗) on right,</text><text x="400" y="228" font-size="13" fill="#0d9488">out of page (⊙) on left</text><text x="400" y="60" font-size="13" fill="#0d9488">|B| = μ₀I/2πr</text><line x1="260" y1="160" x2="330" y2="160" stroke="#111" stroke-width="1.5"/><text x="290" y="152" font-size="13">r</text><text x="260" y="295" text-anchor="middle" font-size="14">Straight wire: B = μ₀I / 2πr (right-hand rule)</text></svg>
