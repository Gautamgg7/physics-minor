<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260"><rect width="520" height="260" fill="#fff"/><line x1="40" y1="150" x2="480" y2="150" stroke="#111" stroke-width="2.5"/><text x="42" y="140" font-size="13">wavefront at t</text><g fill="none" stroke="#4f46e5" stroke-width="2"><circle cx="130" cy="150" r="35"/><circle cx="130" cy="150" r="60"/><circle cx="260" cy="150" r="35"/><circle cx="260" cy="150" r="60"/><circle cx="390" cy="150" r="35"/><circle cx="390" cy="150" r="60"/></g><line x1="40" y1="90" x2="480" y2="90" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="8 4"/><text x="42" y="80" font-size="13" fill="#0d9488">new front at t + Δt (common tangent = envelope)</text><line x1="130" y1="150" x2="130" y2="90" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/><text x="118" y="125" font-size="12" fill="#64748b">vΔt</text><text x="260" y="240" text-anchor="middle" font-size="14">Huygens: every point emits secondary wavelets; their envelope is the new wavefront</text></svg>
